name: Android debug APK
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure Android SDK and accept required licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
