name: Jarvis quality gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  worker:
    name: Worker syntax and source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check cloudflare/jarvis-v2/src/index.js
      - name: Check for accidental secret literals
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[A-Za-z0-9]{30,}|JARVIS_ACCESS_TOKEN[[:space:]]*=[[:space:]]*["\x27][^$])' cloudflare app --exclude='*.lock' --exclude='*.md'; then
            echo "Potential secret literal found; review safely."
            exit 1
          fi
      - name: Check no unsafe shell-eval primitives in browser UI
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^A-Za-z])(eval\(|new Function\(|document\.write\()' cloudflare/jarvis-v2/src/index.js; then
            echo "Review dynamic execution primitive."
            exit 1
          fi
  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
          accept-android-sdk-licenses: true
      - name: Verify Android SDK components
        run: sdkmanager --list_installed
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
