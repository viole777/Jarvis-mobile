name: Jarvis ML pipeline checks

on:
  push:
    paths:
      - "ml/**"
      - ".github/workflows/ml-pipeline-check.yml"
  pull_request:
    paths:
      - "ml/**"
      - ".github/workflows/ml-pipeline-check.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile ml/*.py
      - name: Validate starter training dataset
        run: |
          python ml/validate_dataset.py ml/data/train.jsonl
          python ml/validate_dataset.py ml/data/test.jsonl
