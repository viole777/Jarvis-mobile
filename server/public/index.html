<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis Beta</title><style>body{font-family:system-ui;background:#111;color:#eee;margin:0}main{max-width:800px;margin:auto;padding:20px}.card{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:16px;margin:12px 0}.chat{height:45vh;overflow:auto}.msg{padding:10px;margin:8px 0;border-radius:10px;background:#252525}.me{border-left:3px solid #8ab4f8}.jarvis{border-left:3px solid #8ff0b0}input{width:75%;padding:12px;border-radius:8px;border:1px solid #555;background:#222;color:white}button{padding:12px 16px;border:0;border-radius:8px;margin-left:6px}pre{white-space:pre-wrap}</style></head><body><main><h1>JARVIS BETA</h1><p>Teste cognitivo — sem modelo externo.</p><div class="card chat" id="chat"></div><div><input id="input" placeholder="Fale com o Jarvis..." autofocus><button onclick="send()">Enviar</button><button onclick="resetLab()">Nova sessão</button></div><div class="card"><b>Estado cognitivo</b><pre id="state">Aguardando...</pre></div></main><script>const chat=document.getElementById('chat'),input=document.getElementById('input'),state=document.getElementById('state');function add(who,text){const d=document.createElement('div');d.className='msg '+(who==='Você'?'me':'jarvis');d.innerHTML='<b>'+who+'</b><br>'+text.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function send(){const observation=input.value.trim();if(!observation)return;input.value='';add('Você',observation);try{const r=await fetch('/v1/cognitive/observe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({observation})});const j=await r.json();if(!r.ok)throw new Error(j.error||'erro');const c=j.cognitiveState||{};add('Jarvis',j.response||c.recommendedAction||'Processamento concluído.');state.textContent=JSON.stringify(c,null,2)}catch(e){add('Jarvis','Erro: '+e.message)}}async function resetLab(){await fetch('/v1/cognitive/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});chat.innerHTML='';state.textContent='Sessão reiniciada.'}input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});add('Jarvis','Olá. Este é o beta cognitivo. Estou pronto para receber uma observação.');</script></body></html>
