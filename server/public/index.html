<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>Jarvis — Beta</title><style>*{box-sizing:border-box}body{margin:0;background:#09090b;color:#eee;font-family:Inter,system-ui,-apple-system,sans-serif}main{min-height:100vh;max-width:1050px;margin:auto;padding:18px;display:grid;grid-template-columns:1fr 300px;gap:14px}.app,.side{background:#121216;border:1px solid #292930;border-radius:18px;box-shadow:0 12px 40px #0008}.head{padding:18px;border-bottom:1px solid #292930;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800}.online{font-size:12px;color:#8ff0b0}.chat{height:62vh;overflow:auto;padding:18px}.bubble{max-width:82%;padding:12px 14px;border-radius:15px;margin:10px 0;line-height:1.45;white-space:pre-wrap}.you{margin-left:auto;background:#26364e}.jarvis{background:#1d2420;border:1px solid #2e4938}.composer{display:flex;padding:14px;border-top:1px solid #292930;gap:8px}.composer input{flex:1;min-width:0;background:#09090b;color:#fff;border:1px solid #383840;border-radius:12px;padding:13px;font-size:15px}.btn{border:0;border-radius:12px;padding:0 16px;font-weight:700;cursor:pointer}.send{background:#e8e8ea;color:#09090b}.new{background:#292930;color:#eee;padding:9px 12px}.side{padding:16px}.side h3{margin:4px 0 15px}.metric{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #292930}.metric span:first-child{color:#aaa}.box{margin-top:14px;padding:12px;border-radius:12px;background:#0d0d10;border:1px solid #292930}.box b{display:block;margin-bottom:7px}.muted{color:#8d8d96;font-size:13px}.welcome{color:#aaa;text-align:center;padding:35px 10px}@media(max-width:760px){main{display:block;padding:8px}.side{margin-top:8px}.chat{height:58vh}.side{display:none}.bubble{max-width:90%}.head{padding:14px}.composer{padding:10px}.btn{padding:0 13px}}</style></head><body><main><section class="app"><header class="head"><div><div class="brand">JARVIS</div><div class="muted">Cognitive Beta</div></div><div class="online">● ONLINE</div></header><div class="chat" id="chat"><div class="welcome">Converse com o Jarvis.<br>Este beta usa o núcleo cognitivo independente.</div></div><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="Digite uma mensagem..." autofocus><button class="btn send">Enviar</button><button type="button" class="btn new" id="new">Nova</button></form></section><aside class="side"><h3>Estado do Jarvis</h3><div class="metric"><span>Curiosidade</span><b id="curiosity">—</b></div><div class="metric"><span>Incerteza</span><b id="uncertainty">—</b></div><div class="metric"><span>Concern</span><b id="concern">—</b></div><div class="metric"><span>Confiança</span><b id="confidence">—</b></div><div class="metric"><span>Urgência</span><b id="urgency">—</b></div><div class="box"><b>Próxima ação</b><div id="action" class="muted">Aguardando interação.</div></div><div class="box"><b>Hipóteses</b><div id="hypotheses" class="muted">Nenhuma ainda.</div></div></aside></main><script>const $=id=>document.getElementById(id),chat=$('chat');function bubble(who,text){if(chat.querySelector('.welcome'))chat.innerHTML='';const d=document.createElement('div');d.className='bubble '+(who==='Você'?'you':'jarvis');d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function show(c){['curiosity','uncertainty','concern','confidence','urgency'].forEach(k=>$(k).textContent=c?.[k]??'—');$('action').textContent=c?.recommendedAction||'—';$('hypotheses').textContent=(c?.hypotheses||[]).map((h,i)=>(i+1)+'. '+h.statement+' ('+h.confidence+')').join('\n')||'Nenhuma ainda.'}async function send(){const v=$('input').value.trim();if(!v)return;$('input').value='';bubble('Você',v);bubble('Jarvis','Processando...');try{const r=await fetch('/v1/cognitive/observe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({observation:v})}),j=await r.json();chat.lastChild.remove();if(!r.ok)throw Error(j.error||'Falha no núcleo');const c=j.cognitiveState||{};const reply=c.recommendedAction==='investigate'?'Vou investigar essa situação com base nas evidências disponíveis.':c.recommendedAction==='observe'?'Quero observar mais antes de tirar uma conclusão.':'Entendi. Vou incorporar essa observação ao meu estado atual.';bubble('Jarvis',reply);show(c)}catch(e){chat.lastChild.remove();bubble('Jarvis','Não consegui processar essa observação: '+e.message)}}$('form').onsubmit=e=>{e.preventDefault();send()};$('new').onclick=async()=>{await fetch('/v1/cognitive/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});chat.innerHTML='<div class="welcome">Nova sessão iniciada.</div>';show({})};</script></body></html>
