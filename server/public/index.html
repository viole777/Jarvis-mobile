<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>Jarvis — Beta</title><style>*{box-sizing:border-box}body{margin:0;background:#09090b;color:#eee;font-family:Inter,system-ui,-apple-system,sans-serif}main{min-height:100vh;max-width:1050px;margin:auto;padding:18px;display:grid;grid-template-columns:1fr 300px;gap:14px}.app,.side{background:#121216;border:1px solid #292930;border-radius:18px;box-shadow:0 12px 40px #0008}.head{padding:18px;border-bottom:1px solid #292930;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800}.online{font-size:12px;color:#8ff0b0}.chat{height:62vh;overflow:auto;padding:18px}.bubble{max-width:82%;padding:12px 14px;border-radius:15px;margin:10px 0;line-height:1.45;white-space:pre-wrap}.you{margin-left:auto;background:#26364e}.jarvis{background:#1d2420;border:1px solid #2e4938}.composer{display:flex;padding:14px;border-top:1px solid #292930;gap:8px}.composer input{flex:1;min-width:0;background:#09090b;color:#fff;border:1px solid #383840;border-radius:12px;padding:13px;font-size:15px}.btn{border:0;border-radius:12px;padding:0 16px;font-weight:700;cursor:pointer}.send{background:#e8e8ea;color:#09090b}.new{background:#292930;color:#eee;padding:9px 12px}.side{padding:16px}.side h3{margin:4px 0 15px}.metric{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #292930}.metric span:first-child{color:#aaa}.box{margin-top:14px;padding:12px;border-radius:12px;background:#0d0d10;border:1px solid #292930}.box b{display:block;margin-bottom:7px}.muted{color:#8d8d96;font-size:13px}@media(max-width:760px){main{display:block;padding:8px}.side{margin-top:8px}.chat{height:58vh}.side{display:none}.bubble{max-width:90%}}</style></head><body><main><section class="app"><header class="head"><div><div class="brand">JARVIS</div><div class="muted">Cognitive Beta</div></div><div class="online">● ONLINE</div></header><div class="chat" id="chat"><div class="bubble jarvis">Olá. Estou pronto. Diga alguma coisa e vamos ver como meu estado muda.</div></div><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="Digite uma mensagem..." autofocus><button class="btn send">Enviar</button><button type="button" class="btn new" id="new">Nova</button></form></section><aside class="side"><h3>Estado do Jarvis</h3><div id="metrics"></div><div class="box"><b>Próxima ação</b><div id="action" class="muted">Aguardando interação.</div></div><div class="box"><b>Hipóteses</b><div id="hypotheses" class="muted">Nenhuma ainda.</div></div></aside></main><script>const $=id=>document.getElementById(id),chat=$('chat'),history=[];function bubble(who,text){const d=document.createElement('div');d.className='bubble '+(who==='Você'?'you':'jarvis');d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function show(c){$('metrics').innerHTML=['curiosity','uncertainty','concern','confidence','urgency'].map(k=>'<div class="metric"><span>'+k+'</span><b>'+(c?.[k]??'—')+'</b></div>').join('');$('action').textContent=c?.recommendedAction||'—';$('hypotheses').innerHTML=(c?.hypotheses||[]).map((h,i)=>(i+1)+'. '+h.statement+' <small>('+h.confidence+')</small>').join('<br>')||'Nenhuma ainda.'}function reply(c,text){const t=text.toLowerCase(),changed=c?.reason?.toLowerCase().includes('change'),u=c?.uncertainty,action=c?.recommendedAction;if(/oi|olá|ola|hey|hello/.test(t))return 'Olá. Estou acompanhando esta conversa. O que você quer explorar?';if(/quem é você|quem e voce/.test(t))return 'Sou o Jarvis. Neste beta estou usando meu núcleo cognitivo independente para interpretar observações e atualizar meu estado.';if(/como você está|como voce esta/.test(t))return 'Meu estado atual indica '+(c?.confidence||'baixa')+' confiança, com incerteza '+(u||'baixa')+'. Ainda estou avaliando o contexto.';if(action==='investigate')return changed?'Isso mudou em relação ao que eu tinha observado. Vou investigar antes de assumir uma explicação.':'Há sinais que merecem investigação. Não quero inventar uma causa sem evidência.';if(action==='observe')return 'Isso introduziu algo novo ou incerto. Vou observar mais antes de formar uma conclusão forte.';if(u==='high')return 'Ainda faltam informações para uma conclusão confiável. Prefiro manter a hipótese aberta por enquanto.';if(changed)return 'Percebi uma mudança em relação à observação anterior. Vou ajustar minha representação do que está acontecendo.';if(history.length%3===0)return 'Registrei isso. Há contexto suficiente para continuar a partir daqui.';if(history.length%3===1)return 'Entendi o ponto. Vou relacioná-lo ao contexto que já tenho.';return 'Essa informação foi incorporada ao contexto atual. Podemos continuar a partir dela.'}async function send(){const v=$('input').value.trim();if(!v)return;$('input').value='';bubble('Você',v);bubble('Jarvis','...');try{const r=await fetch('/v1/cognitive/observe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({observation:v})}),j=await r.json();chat.lastChild.remove();if(!r.ok)throw Error(j.error||'Falha no núcleo');history.push(v);const c=j.cognitiveState||{};bubble('Jarvis',reply(c,v));show(c)}catch(e){chat.lastChild.remove();bubble('Jarvis','Encontrei um erro ao processar isso: '+e.message)}}$('form').onsubmit=e=>{e.preventDefault();send()};$('new').onclick=async()=>{await fetch('/v1/cognitive/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});history.length=0;chat.innerHTML='';bubble('Jarvis','Nova sessão iniciada. Estou pronto para observar novamente.');show({})};</script></body></html>
