<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis — Visual Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0f;color:#e8edf2;font:14px Inter,system-ui,sans-serif}
button,input{font:inherit}button{cursor:pointer}.wrap{min-height:100vh;display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:20px;padding:20px;max-width:1400px;margin:auto}
.panel,.phone{border:1px solid #252b33;background:#10141a;border-radius:18px;box-shadow:0 20px 60px #0008}.panel{padding:20px}.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand h1{margin:0;font-size:22px}.dot{width:9px;height:9px;background:#53e38a;border-radius:50%;display:inline-block;box-shadow:0 0 14px #53e38a}
label{display:block;color:#929daa;font-size:12px;margin:14px 0 7px}.row{display:flex;gap:8px}.row button{flex:1}.btn{border:1px solid #303945;background:#171d25;color:#e8edf2;padding:11px 12px;border-radius:10px}.btn:hover{background:#202834}.primary{background:#245f86;border-color:#327eae}.danger{background:#5a292d;border-color:#87434a}.input{width:100%;padding:12px;border-radius:10px;border:1px solid #303945;background:#0b0e12;color:#fff;outline:none}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid #303945;background:#151a20;border-radius:999px;padding:6px 9px;color:#aeb8c3}.log{height:230px;overflow:auto;background:#090c10;border:1px solid #252b33;border-radius:10px;padding:10px;font:12px ui-monospace,monospace}.line{margin:0 0 8px}.ok{color:#6ee7a0}.warn{color:#ffd166}.muted{color:#77818e}.tool{color:#72b8ff}.phone-wrap{display:grid;place-items:center;min-height:680px}.phone{width:min(390px,90vw);height:720px;border-radius:38px;padding:12px;background:#05070a;border-color:#343b46}.screen{height:100%;border-radius:29px;overflow:hidden;background:#f5f7f9;color:#151a20;position:relative}.status{height:30px;padding:7px 16px;font-size:11px;background:#fff;display:flex;justify-content:space-between}.browser{height:52px;background:#eef1f4;padding:9px;display:flex;gap:7px;align-items:center}.browser input{flex:1;border:1px solid #ccd2d8;background:white;border-radius:20px;padding:9px 12px}.web{padding:24px 18px}.search{border:1px solid #d1d7dd;padding:13px;border-radius:10px;background:#fff;margin-bottom:15px}.result{padding:16px;background:#fff;border:1px solid #d8dde2;border-radius:12px}.fab{position:absolute;right:18px;bottom:18px;background:#111923;color:#fff;border:0;border-radius:50%;width:52px;height:52px;font-size:22px}.state{padding:8px 12px;border-top:1px solid #272e38;color:#9da7b3;font-size:12px}
.bar{height:8px;background:#202630;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:#59b4ee;transition:.3s}.step{display:flex;gap:10px;align-items:center;margin:8px 0}.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#202833;color:#9aa6b3;font-size:11px}.active .num{background:#245f86;color:white}.done .num{background:#286342;color:white}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.phone-wrap{min-height:auto}}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
  <div class="brand"><h1>JARVIS</h1><span><i class="dot"></i> simulator</span></div>
  <p class="muted">Simulação visual do Agent Loop. Isto não controla o Android real.</p>
  <label>Gatilho</label>
  <div class="row"><button class="btn primary" onclick="wake('voice')">🎙️ “Jarvis”</button><button class="btn" onclick="wake('clap')">👏👏 Palmas</button></div>
  <label>Comando</label>
  <input id="cmd" class="input" value="Abra o Chrome, pesquise Minecraft e volte">
  <div class="chips">
    <button class="chip" onclick="preset('Abra o Chrome e pesquise Minecraft')">Chrome + pesquisa</button>
    <button class="chip" onclick="preset('Role para baixo e clique em Continuar')">Scroll + click</button>
    <button class="chip" onclick="preset('Digite Minecraft na busca')">Type text</button>
  </div>
  <button class="btn primary" style="width:100%;margin-top:8px" onclick="run()">▶ Executar simulação</button>
  <label>Pipeline</label>
  <div id="steps"></div>
  <label>Agent log</label>
  <div id="log" class="log"></div>
</section>
<section class="phone-wrap">
  <div class="phone">
    <div class="screen">
      <div class="status"><span>11:42</span><span>◔ ◉ ▰</span></div>
      <div class="browser"><button class="btn" style="padding:7px 10px" onclick="back()">‹</button><input id="url" value="chrome://newtab" readonly></div>
      <div id="web" class="web">
        <h2 style="margin-top:5px">Chrome</h2>
        <div class="search" id="searchBox">Pesquisar ou digitar endereço</div>
        <div id="result"></div>
      </div>
      <div class="state" id="phoneState">Android aguardando comando</div>
      <button class="fab" onclick="wake('voice')">🎙</button>
    </div>
  </div>
</section>
</div>
<script>
const $=id=>document.getElementById(id);
let awakened=false,busy=false;
const base=['Wake trigger','Speech-to-Text','Agent / SLM','Tool call','Safety Engine','Android action','Verify result'];
function renderSteps(active=-1,done=-1){$('steps').innerHTML=base.map((x,i)=>'<div class="step '+(i===active?'active ':'')+(i<=done?'done':'')+'"><span class="num">'+(i<=done?'✓':i+1)+'</span><span>'+x+'</span></div>').join('')}
function log(t,c=''){const d=document.createElement('div');d.className='line '+c;d.textContent=t;$('log').appendChild(d);$('log').scrollTop=9999}
function preset(v){$('cmd').value=v}
function wake(type){awakened=true;renderSteps(1,0);log(type==='voice'?'🎙️ Wake word “Jarvis” detectada.':'👏👏 Duas palmas detectadas.','ok');log('🔊 Jarvis ativo — aguardando comando...','muted');setTimeout(()=>run(),500)}
async function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function run(){
 if(busy)return; busy=true;
 const cmd=$('cmd').value.trim(); if(!awakened){log('⚠️ Primeiro ative com “Jarvis” ou duas palmas.','warn');busy=false;return}
 $('log').innerHTML=''; log('👤 '+cmd);renderSteps(2,1);await wait(500);
 log('🧠 Interpretando intenção...');await wait(500);
 const lower=cmd.toLowerCase();
 const actions=[];
 if(lower.includes('chrome')||lower.includes('navegador'))actions.push('open_app(Chrome)');
 if(lower.includes('pesquis')||lower.includes('buscar'))actions.push('type_text(Minecraft)');
 if(lower.includes('role')||lower.includes('desça'))actions.push('scroll(down)');
 if(lower.includes('clique')||lower.includes('continuar'))actions.push('click(Continuar)');
 if(lower.includes('volte')||lower.includes('voltar'))actions.push('back()');
 if(!actions.length)actions.push('inspect_screen()');
 for(let i=0;i<actions.length;i++){
   const a=actions[i]; renderSteps(3,2); log('🔧 '+a,'tool'); await wait(650);
   if(/type_text|click/.test(a)){renderSteps(4,3);log('🛡️ Safety Engine: ação simulada como permitida.','ok');await wait(500)}
   else {renderSteps(4,3);log('🛡️ Safety Engine: permitido.','ok');await wait(300)}
   renderSteps(5,4); applyAction(a); log('📱 Android: '+a,'ok');await wait(600);renderSteps(6,5);
 }
 log('✓ Resultado verificado. Jarvis concluiu a tarefa.','ok');$('phoneState').textContent='Jarvis: tarefa concluída';await wait(300);awakened=false;busy=false
}
function applyAction(a){
 if(a.startsWith('open_app')){$('url').value='https://www.google.com';$('web').innerHTML='<h2>Chrome</h2><div class="search">Google Search</div><div id="result"></div>'}
 if(a.startsWith('type_text')){$('web').querySelector('.search').textContent='Minecraft';$('web').querySelector('.search').style.outline='2px solid #59b4ee'}
 if(a.startsWith('scroll')){$('web').style.transform='translateY(-30px)';}
 if(a.startsWith('click')){$('result').innerHTML='<div class="result"><b>Minecraft</b><p>Resultado de pesquisa simulado.</p></div>'}
 if(a.startsWith('back')){$('url').value='chrome://newtab';$('web').innerHTML='<h2>Chrome</h2><div class="search">Pesquisar ou digitar endereço</div>'}
 $('phoneState').textContent='Executando: '+a
}
function back(){applyAction('back()');log('📱 back() manual','tool')}
renderSteps();log('Sistema pronto. Ative o Jarvis.','muted');
</script>
</body>
</html>
